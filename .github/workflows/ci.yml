name: Windows addon checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Mod tests, privacy and native API
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build Windows helper
        working-directory: source
        run: go build -buildvcs=false -trimpath -ldflags '-s -w -H=windowsgui' -o ../bin/udp-telemetry.exe .
      - name: Go tests and launcher capability compatibility
        working-directory: source
        run: go test -trimpath ./...
      - name: Go vet
        working-directory: source
        run: go vet ./...
      - name: Memory retention and load cancellation
        working-directory: source
        run: go test -trimpath -count=1 -run 'Test(AnalysisRetentionBudget|ScopeChangesRequireReplayAndReleaseUnusedTraces|BorrowedJournalBufferAndCancellation|UnchangedAnalysisDoesNotInvalidateEveryTick)$' -v
      - name: No image controls or chart files
        working-directory: source
        env:
          UDP_TELEMETRY_NATIVE_VIEWS: ${{ github.workspace }}/.verify/native-views.jsonl
        run: |
          New-Item -ItemType Directory -Force ../.verify | Out-Null
          go test -trimpath -count=1 -run '^TestNativeViewsDoNotWriteChartFiles$' -v
      - name: Live UDP protocol integration
        run: python source/integration_test.py
      - name: Saved analysis integration and no image generation
        run: python source/analysis_integration_test.py
      - name: Process lifecycle and UDP port release
        run: python checks/lifecycle_check.py
      - name: Build installable ZIP
        run: python source/package.py
      - name: Package integrity, versions and privacy
        run: python checks/package_check.py
      - name: Check out the released Swofty 1.9.55 API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Swofty-Developments/SwoftyLauncher
          ref: e69f4d905c404a2615412c1060fdfa2e4b716653
          path: .verify/launcher
          persist-credentials: false
      - name: Install Rust required by the pinned launcher
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native charts against the actual launcher API
        run: |
          New-Item -ItemType Directory -Force .verify/launcher/packages/addon-api/examples | Out-Null
          Copy-Item checks/native_api.rs .verify/launcher/packages/addon-api/examples/telemetry_contract.rs
          cargo +1.95.0 run --locked --manifest-path .verify/launcher/Cargo.toml -p swofty-addon --example telemetry_contract -- .verify/native-views.jsonl
