name: Windows addon checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Unit tests
            command: go -C source test -trimpath -count=1 ./...
          - name: Static analysis
            command: go -C source vet ./...
          - name: Launcher protocol compatibility
            command: go -C source test -trimpath -count=1 -run '^TestReleasedAndFutureLauncherHandshake$' -v
          - name: Live memory bounds
            command: go -C source test -trimpath -count=1 -run '^TestBoundedLiveMemory$' -v
          - name: Live-only acquisition policy
            python: true
            command: python checks/live_policy.py
          - name: Native game readers
            python: true
            command: |
              python native/build.py --tests-only
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $env:TELEMETRY_ABI_FRAME = Join-Path (Get-Location) '.verify/native/frame.bin'
              go -C source test -trimpath -count=1 -run '^TestNativeABI$' -v
          - name: Native publisher lifecycle
            python: true
            command: python native/build.py
          - name: Helper lifecycle and shutdown
            python: true
            helper: true
            command: python checks/lifecycle_check.py
          - name: Package integrity and versions
            python: true
            helper: true
            command: |
              python native/build.py
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python source/package.py
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python checks/package_check.py --check integrity
          - name: Privacy - source and ZIP
            python: true
            helper: true
            command: |
              python native/build.py
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python source/package.py
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python checks/package_check.py --check privacy
          - name: Native live API - Swofty 1.9.55
            native: true
            command: |
              New-Item -ItemType Directory -Force .verify | Out-Null
              $env:TELEMETRY_NATIVE_VIEWS = Join-Path (Get-Location) '.verify/native-views.jsonl'
              go -C source test -trimpath -count=1 -run '^TestLiveViewAndSetup$' -v
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.python == true
        with:
          python-version: '3.14'
      - name: Build Windows helper
        if: matrix.helper == true
        working-directory: source
        run: go build -buildvcs=false -trimpath -ldflags '-s -w -H=windowsgui' -o ../bin/telemetry-live.exe .
      - name: Run check
        run: ${{ matrix.command }}
      - name: Check out released Swofty 1.9.55
        if: matrix.native == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Swofty-Developments/SwoftyLauncher
          ref: e69f4d905c404a2615412c1060fdfa2e4b716653
          path: .verify/launcher
          persist-credentials: false
      - name: Compare the vendored native SDK
        if: matrix.native == true
        run: |
          $ours = (Get-FileHash native/swofty_api.h -Algorithm SHA256).Hash
          $upstream = (Get-FileHash .verify/launcher/packages/sdk/include/swofty_api.h -Algorithm SHA256).Hash
          if ($ours -ne $upstream) { throw 'Native SDK differs from the pinned release' }
      - name: Install Rust required by the pinned launcher
        if: matrix.native == true
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Validate against the actual launcher API
        if: matrix.native == true
        run: |
          New-Item -ItemType Directory -Force .verify/launcher/packages/addon-api/examples | Out-Null
          Copy-Item checks/native_api.rs .verify/launcher/packages/addon-api/examples/telemetry_contract.rs
          cargo +1.95.0 run --locked --manifest-path .verify/launcher/Cargo.toml -p swofty-addon --example telemetry_contract -- .verify/native-views.jsonl .
