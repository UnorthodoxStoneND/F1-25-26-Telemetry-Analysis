name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOOS: windows
  GOARCH: amd64
  GOAMD64: v1
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  build:
    name: Build shared test artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build native DLL and test executables without executing tests
        run: python native/build.py --build-only
      - name: Build helper and Go test executable once
        run: |
          go -C source build -buildvcs=false -trimpath -o ../bin/telemetry-live.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C source test -c -trimpath -o ../.verify/go-tests.exe .
      - name: Build native Linux launcher helper
        run: |
          $env:GOOS = 'linux'
          go -C source build -buildvcs=false -trimpath -o ../bin/telemetry-live-linux .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package once for integrity and privacy checks
        run: python source/package.py --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: addon-test-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/
            dist/
            .verify/go-tests.exe
            .verify/native/*.exe
            .verify/native/swofty_core.dll

  checks:
    name: ${{ matrix.name }}
    needs: build
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Unit tests
            check: unit
          - name: Static analysis
            check: static
          - name: Launcher protocol compatibility
            check: protocol
          - name: Live memory bounds
            check: memory
          - name: Live-only acquisition policy
            check: policy
          - name: Native game readers
            check: readers
          - name: Native publisher lifecycle
            check: publisher
          - name: Helper lifecycle and shutdown
            check: helper
          - name: Package integrity and versions
            check: integrity
          - name: Privacy - source and ZIP
            check: privacy
    steps:
      - name: Require successful shared build
        run: |
          if ('${{ needs.build.result }}' -ne 'success') { throw 'Shared build failed; this validation cannot pass.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.check == 'static'
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: addon-test-build
          path: .
      - name: Run the individual validation
        run: python tools/checks/ci_check.py ${{ matrix.check }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.check == 'unit' && success()
        with:
          name: live-view-fixtures
          path: .verify/native-views.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  prepare-swofty:
    name: Prepare Swofty validation tools
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Resolve releases and build each upstream validator once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/checks/swofty_compat.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swofty-validation-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .verify/swofty-compat/versions.json
            .verify/swofty-compat/sdk-baseline.json
            .verify/swofty-compat/minimum/
            .verify/swofty-compat/latest/

  swofty:
    name: ${{ matrix.name }}
    needs: [build, checks, prepare-swofty]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: Swofty manifest - minimum supported
            release: minimum
            kind: manifest
          - name: Swofty launcher views - minimum supported
            release: minimum
            kind: views
          - name: Swofty native SDK - minimum supported
            release: minimum
            kind: sdk
          - name: Swofty manifest - latest stable
            release: latest
            kind: manifest
          - name: Swofty launcher views - latest stable
            release: latest
            kind: views
          - name: Swofty native SDK - latest stable
            release: latest
            kind: sdk
    steps:
      - name: Require successful preparation
        run: |
          if ('${{ needs.build.result }}' -ne 'success' -or '${{ needs.prepare-swofty.result }}' -ne 'success') { throw 'Preparation failed; this compatibility check cannot pass.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swofty-validation-tools
          path: .verify/swofty-compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.kind == 'views'
        with:
          name: live-view-fixtures
          path: .verify
      - name: Run the individual Swofty validation
        run: python tools/checks/swofty_compat.py check --release ${{ matrix.release }} --kind ${{ matrix.kind }}

  linux:
    name: Linux helper and shared transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.4'
          cache: false
      - run: go -C source test -trimpath -count=1 ./...
      - run: go -C source vet ./...
